name: Refresh Dota2BP data

on:
  workflow_dispatch:
    inputs:
      include_matchups:
        description: "Fetch the full opponent matchup matrix"
        required: false
        default: "false"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build model snapshot
        run: |
          if [ "${{ github.event.inputs.include_matchups }}" = "true" ]; then
            python scripts/build_model.py --out data/model.json --with-matchups
          else
            python scripts/build_model.py --out data/model.json
          fi
      - name: Build personal model
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          python scripts/build_player_model.py \
            --steam-profile "https://steamcommunity.com/profiles/76561198182670383/" \
            --out data/player_model.json \
            --max-matches 300
      - name: Build team model
        run: |
          python scripts/build_team_model.py \
            --player "https://steamcommunity.com/profiles/76561198182670383/" \
            --player "https://steamcommunity.com/profiles/76561198320148933/" \
            --player "https://steamcommunity.com/id/amituofo6666/" \
            --player "https://steamcommunity.com/profiles/76561198146231486/" \
            --player "https://steamcommunity.com/profiles/76561198106506910/" \
            --player "https://steamcommunity.com/profiles/76561198343705647/" \
            --out data/team_model.json \
            --max-matches 300
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/model.json data/player_model.json data/team_model.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh Dota2BP model data"
            git push
          fi
